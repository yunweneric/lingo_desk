# Launch screens for the mobile targets. flutter_native_splash covers
# Android, iOS and web only — the desktop shells (macOS, Windows, Linux)
# have no native splash stage, so they are left off.
#   dart run flutter_native_splash:create
flutter_native_splash:
  android: true
  ios: true
  web: false

  color: "#FAFAF9"
  color_dark: "#0E1B18"

  image: assets/brand/icons/splash_logo.png
  image_dark: assets/brand/icons/splash_logo_dark.png

  android_gravity: center
  ios_content_mode: center

  # Android 12+ masks the icon to a circle and paints the backdrop itself,
  # so it gets the bare tiles over the brand teal.
  android_12:
    color: "#FAFAF9"
    color_dark: "#0E1B18"
    image: assets/brand/icons/splash_android12.png
    image_dark: assets/brand/icons/splash_android12.png
    icon_background_color: "#0F766E"
    icon_background_color_dark: "#0F766E"
