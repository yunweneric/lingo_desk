# Shapes the changelog that `generate_release_notes` appends to each release.
# Without this, every merged PR lands in one flat "What's Changed" list.
changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot
  categories:
    - title: ✨ Features
      labels: [feature, enhancement]
    - title: 🐛 Fixes
      labels: [bug, fix]
    - title: 🧹 Maintenance
      labels: [chore, refactor, ci, documentation]
    - title: 📦 Other changes
      labels: ["*"]
