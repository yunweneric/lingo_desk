name: Build Android APK

# Per-push APK artifacts only. Tagged releases are built and published by
# release.yml, which assembles macOS, Windows and Android into a single
# GitHub Release; two workflows creating the same release raced each other
# and clobbered one another's notes.
on:
  push:
    branches:
      - main
      - release
  pull_request:
    branches:
      - release
  workflow_dispatch: # Allow manual triggering

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Install FVM
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Setup Flutter via FVM
        run: |
          # Try to read Flutter version from FVM config files
          if [ -f ".fvmrc" ]; then
            FLUTTER_VERSION=$(grep -o '"flutter"[[:space:]]*:[[:space:]]*"[^"]*"' .fvmrc | cut -d'"' -f4)
            echo "Using Flutter version from .fvmrc: $FLUTTER_VERSION"
            fvm install $FLUTTER_VERSION
            fvm use $FLUTTER_VERSION --force
          elif [ -f ".fvm/fvm_config.json" ]; then
            FLUTTER_VERSION=$(grep -o '"flutterSdkVersion"[[:space:]]*:[[:space:]]*"[^"]*"' .fvm/fvm_config.json | cut -d'"' -f4)
            echo "Using Flutter version from FVM config: $FLUTTER_VERSION"
            fvm install $FLUTTER_VERSION
            fvm use $FLUTTER_VERSION --force
          else
            # Fallback: use a specific version
            FLUTTER_VERSION="3.38.10"
            echo "FVM config not found, using Flutter version: $FLUTTER_VERSION"
            fvm install $FLUTTER_VERSION
            fvm use $FLUTTER_VERSION --force
          fi
          fvm flutter --version

      - name: Get dependencies
        run: fvm flutter pub get

      - name: Verify formatting
        run: fvm dart format --set-exit-if-changed .

      - name: Analyze code
        run: fvm flutter analyze

      - name: Run tests
        run: fvm flutter test

      - name: Build APK (Debug)
        run: fvm flutter build apk --debug

      - name: Build APK (Release)
        run: fvm flutter build apk --release

      - name: Build App Bundle (AAB) - Release
        run: fvm flutter build appbundle --release
        continue-on-error: true # Continue even if signing fails

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lingodesk-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 90
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lingodesk-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
          if-no-files-found: error

      - name: Upload App Bundle (AAB) - Release
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lingodesk-release-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 90
          if-no-files-found: ignore

      - name: Build Summary
        if: always()
        run: |
          echo "## 📦 Build Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The following artifacts are available for download:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### APK Files" >> $GITHUB_STEP_SUMMARY
          echo "- **Debug APK**: \`lingodesk-debug-apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release APK**: \`lingodesk-release-apk\` (Recommended for testing)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### App Bundle" >> $GITHUB_STEP_SUMMARY
          echo "- **Release AAB**: \`lingodesk-release-bundle\` (For Google Play Store)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 💡 Go to the **Actions** tab → Select this workflow run → Scroll down to **Artifacts** section to download." >> $GITHUB_STEP_SUMMARY

