name: Build Desktop Apps

on:
  push:
    branches:
      - main
      - release
    tags:
      - "v*"
  pull_request:
    branches:
      - release
  workflow_dispatch: # Allow manual triggering

# Only keep the latest run per ref; releases are never cancelled.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write # required to create GitHub Releases

jobs:
  prepare:
    name: Resolve build metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      numeric_version: ${{ steps.meta.outputs.numeric_version }}
      flutter_version: ${{ steps.meta.outputs.flutter_version }}
      is_release: ${{ steps.meta.outputs.is_release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve version and Flutter SDK
        id: meta
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Flutter SDK version: .fvmrc is the source of truth for the project.
          if [ -f ".fvmrc" ]; then
            FLUTTER_VERSION=$(grep -o '"flutter"[[:space:]]*:[[:space:]]*"[^"]*"' .fvmrc | cut -d'"' -f4)
          fi
          FLUTTER_VERSION="${FLUTTER_VERSION:-3.38.10}"

          # Artifact version: tag name for releases, pubspec version + sha otherwise.
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            VERSION="${VERSION#v}"
            IS_RELEASE=true
          else
            PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
            VERSION="${PUBSPEC_VERSION}-$(echo "${GITHUB_SHA}" | cut -c1-7)"
            IS_RELEASE=false
          fi

          # Bundle/installer metadata only accepts a plain x.y.z version.
          NUMERIC_VERSION="${VERSION%%-*}"

          {
            echo "version=${VERSION}"
            echo "numeric_version=${NUMERIC_VERSION}"
            echo "flutter_version=${FLUTTER_VERSION}"
            echo "is_release=${IS_RELEASE}"
          } >> "$GITHUB_OUTPUT"

          echo "Version: ${VERSION} | Flutter: ${FLUTTER_VERSION} | Release: ${IS_RELEASE}"

  verify:
    name: Analyze & test
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.prepare.outputs.flutter_version }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    needs: [prepare, verify]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.prepare.outputs.flutter_version }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build macOS app (release)
        run: flutter build macos --release --build-name=${{ needs.prepare.outputs.numeric_version }}

      - name: Create DMG
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          APP_NAME=$(grep "PRODUCT_NAME" macos/Runner/Configs/AppInfo.xcconfig | cut -d'=' -f2 | xargs)
          APP_PATH="build/macos/Build/Products/Release/${APP_NAME}.app"
          DMG_PATH="build/dist/${APP_NAME}-${VERSION}-macos.dmg"

          mkdir -p build/dist
          STAGE_DIR=$(mktemp -d)
          cp -R "${APP_PATH}" "${STAGE_DIR}/"
          ln -s /Applications "${STAGE_DIR}/Applications"

          hdiutil create -volname "${APP_NAME}" \
            -srcfolder "${STAGE_DIR}" \
            -ov -format UDZO \
            "${DMG_PATH}"

          rm -rf "${STAGE_DIR}"
          ls -lh "${DMG_PATH}"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: lingodesk-macos-dmg
          path: build/dist/*.dmg
          retention-days: 90
          if-no-files-found: error

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    needs: [prepare, verify]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.prepare.outputs.flutter_version }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows app (release)
        run: flutter build windows --release --build-name=${{ needs.prepare.outputs.numeric_version }}

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # PowerShell, not bash: Git Bash on the Windows runner applies MSYS
      # path conversion to any argument starting with "/", so ISCC's
      # /DName=Value defines arrive rewritten as filesystem paths. The
      # compiler then sees five script filenames instead of one option and
      # fails with "You may not specify more than one script filename".
      - name: Build installer
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          NUMERIC_VERSION: ${{ needs.prepare.outputs.numeric_version }}
        run: |
          $ErrorActionPreference = 'Stop'

          $buildDir = 'build\windows\x64\runner\Release'
          if (-not (Test-Path "$buildDir\lingo_desk.exe")) {
            throw "Missing Flutter build output: $buildDir\lingo_desk.exe"
          }

          New-Item -ItemType Directory -Force -Path build\dist | Out-Null

          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          & $iscc `
            "/DMyAppVersion=$env:NUMERIC_VERSION" `
            "/DSourceDir=$PWD\$buildDir" `
            "/DOutputDir=$PWD\build\dist" `
            "/DOutputName=LingoDesk-$env:VERSION-windows-setup" `
            'windows\installer\lingo_desk.iss'

          if ($LASTEXITCODE -ne 0) { throw "ISCC exited with $LASTEXITCODE" }

          Get-ChildItem build\dist

      - name: Create portable ZIP
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          Compress-Archive `
            -Path 'build\windows\x64\runner\Release\*' `
            -DestinationPath "build\dist\LingoDesk-$env:VERSION-windows-portable.zip" `
            -Force
          Get-ChildItem build\dist

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lingodesk-windows
          path: |
            build/dist/*.exe
            build/dist/*.zip
          retention-days: 90
          if-no-files-found: error

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: [prepare, verify]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.prepare.outputs.flutter_version }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release --build-name=${{ needs.prepare.outputs.numeric_version }}

      - name: Build App Bundle (release)
        run: flutter build appbundle --release --build-name=${{ needs.prepare.outputs.numeric_version }}

      - name: Stage artifacts
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p build/dist
          # Named to match the desktop artifacts, so one Release page reads
          # as one set rather than Flutter's generic app-release.apk.
          cp build/app/outputs/flutter-apk/app-release.apk \
             "build/dist/LingoDesk-${VERSION}-android.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
             "build/dist/LingoDesk-${VERSION}-android.aab"
          ls -lh build/dist

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lingodesk-android
          path: build/dist/*
          retention-days: 90
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare, build-macos, build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR dist

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          # The app ships unsigned, so a published digest is the only way a
          # downloader can verify what they got.
          shopt -s nullglob
          files=(*.dmg *.exe *.zip *.apk *.aab)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No release artifacts found to checksum" >&2
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: LingoDesk ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## 🚀 LingoDesk ${{ github.ref_name }}

            ### 📦 Downloads

            | Platform | File |
            | --- | --- |
            | macOS | `LingoDesk-${{ needs.prepare.outputs.version }}-macos.dmg` |
            | Windows (installer) | `LingoDesk-${{ needs.prepare.outputs.version }}-windows-setup.exe` |
            | Windows (portable) | `LingoDesk-${{ needs.prepare.outputs.version }}-windows-portable.zip` |
            | Android (APK) | `LingoDesk-${{ needs.prepare.outputs.version }}-android.apk` |
            | Android (Play bundle) | `LingoDesk-${{ needs.prepare.outputs.version }}-android.aab` |

            The macOS build is a universal binary — one download runs natively
            on both Apple Silicon and Intel.

            > **Unsigned builds.** On macOS the first launch is blocked: open
            > **System Settings → Privacy & Security** and choose **Open Anyway**
            > (right-click → Open no longer bypasses Gatekeeper on macOS 15+).
            > On Windows, choose **More info → Run anyway** in SmartScreen.
            > The Android APK is debug-signed — enable installing from unknown sources.

            Verify a download against `SHA256SUMS.txt`:
            `shasum -a 256 -c SHA256SUMS.txt --ignore-missing`
          files: dist/**/*
          # Appends the commit/PR changelog under the body above, so the notes
          # stop pointing at the commit history and just carry it.
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    name: Build summary
    runs-on: ubuntu-latest
    needs: [prepare, build-macos, build-windows, build-android]
    if: always()
    steps:
      - name: Write summary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          MACOS_RESULT: ${{ needs.build-macos.result }}
          WINDOWS_RESULT: ${{ needs.build-windows.result }}
          ANDROID_RESULT: ${{ needs.build-android.result }}
        run: |
          {
            echo "## 📦 Desktop builds — \`${VERSION}\`"
            echo ""
            echo "| Platform | Artifact | Status |"
            echo "| --- | --- | --- |"
            echo "| macOS | \`lingodesk-macos-dmg\` (.dmg) | ${MACOS_RESULT} |"
            echo "| Windows | \`lingodesk-windows\` (.exe + .zip) | ${WINDOWS_RESULT} |"
            echo "| Android | \`lingodesk-android\` (.apk + .aab) | ${ANDROID_RESULT} |"
            echo ""
            echo "> 💡 Actions tab → this run → **Artifacts** to download."
          } >> "$GITHUB_STEP_SUMMARY"
